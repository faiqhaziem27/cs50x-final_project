{% extends "layout.html" %}

{% block title %}
    History
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4">History</h3>
            <table class="table table-striped mx-auto w-auto">
            <thead>
                <tr>
                    <th>Category</th>
                    <th>Metric Value</th>
                    <th>Date/Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for row in entries %}
                    <tr>
                        <td>{{ row.category }}</td>
                        <td>{{ row.metric_value }} {{ row.unit }}</td>
                        <td>{{ row.date }}</td>
                        <td>
                            <a href="/edit/{{ row.id }}" class="btn btn-sm btn-outline-primary me-1">Edit</a>

                            <form action="/delete" method="post" class="d-inline">
                                <input type="hidden" name="id" value="{{ row.id }}">
                                <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this entry?');">
                                    Delete
                                </button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
            </table>
{% endblock %}
