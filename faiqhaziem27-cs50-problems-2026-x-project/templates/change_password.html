{% extends "layout.html" %}

{% block title %}
    Change Password
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4">Change Password</h3>
            <form method="post" action="/change_password">
                <div class="mb-3">
                    <input autocomplete="off" autofocus name="current_password" class="form-control mx-auto w-auto" placeholder="Current Password" type="password" required>
                </div>

                <div class="mb-3">
                    <input autocomplete="off" name="new_password" class="form-control mx-auto w-auto" placeholder="New Password" type="password" required>
                </div>

                <div class="mb-3">
                    <input autocomplete="off" name="confirmation" class="form-control mx-auto w-auto" placeholder="Confirmation" type="password" required>
                </div>

                <button class="btn btn-primary" type="submit">Submit</button>
            </form>
        </div>
    </div>
{% endblock %}
