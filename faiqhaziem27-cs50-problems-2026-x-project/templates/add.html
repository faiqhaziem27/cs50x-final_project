{% extends "layout.html" %}

{% block title %}
    Add
{% endblock %}

{% block main %}
    <div class="row justify-content-center">
        <div class="col-md-5">
            <h2 class="mb-4">Add Entries</h3>
            <form action="/add" method="post">
                <div class="mb-3">
                    <input autocomplete="off" autofocus class="form-control mx-auto w-auto" list="CategoryOptions" name="category" placeholder="Type or select a category">
                    <datalist id="CategoryOptions">
                        {% for cat in categories %}
                            <option value="{{ cat }}"></option>
                        {% endfor %}
                    </datalist>
                </div>

                <div class="mb-3">
                    <input autocomplete="off" class="form-control mx-auto w-auto" name="metric_value" placeholder="Metric Value (e.g. 3)" min="0" type="number" required>
                </div>

                <div class="mb-3">
                    <input autocomplete="off" class="form-control mx-auto w-auto" name="unit" placeholder="Unit (e.g. hours, pages, questions)" size="28" type="text">
                </div>

                <div class="mb-3">
                    <input autocomplete="off" class="form-control mx-auto w-auto" name="date" placeholder="Date" type="date" required>
                </div>

                <button class="btn btn-primary" type="submit">Submit</button>
                </form>
        </div>
    </div>
{% endblock %}
